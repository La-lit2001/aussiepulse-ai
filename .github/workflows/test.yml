name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aussiepulse
          POSTGRES_PASSWORD: aussiepulse_dev
          POSTGRES_DB: aussiepulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aussiepulse -d aussiepulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest
        env:
          PYTHONPATH: src
          DATABASE_URL: postgresql://aussiepulse:aussiepulse_dev@localhost:5432/aussiepulse
